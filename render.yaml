# Render Blueprint — no external MySQL required (uses H2 on Render disk)
services:
  - type: web
    name: team-task-manager-api
    env: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://team-task-manager-topaz-omega.vercel.app
      - key: JPA_DDL_AUTO
        value: update
      - key: JPA_SHOW_SQL
        value: "false"
