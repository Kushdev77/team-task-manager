spring.application.name=backend
spring.config.import=optional:classpath:application-local.properties

# Database (override in cloud with environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/team_task_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Render sets PORT automatically
server.port=${PORT:8080}

# JWT — MUST set JWT_SECRET in production (Render dashboard)
app.jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_LONG_RANDOM_STRING_256_BITS_MIN}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma-separated origins (add your Vercel URL after deploy)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://team-task-manager-topaz-omega.vercel.app,https://team-task-manager-ktydex5w6-devesh-kushwah-s-projects.vercel.app}
