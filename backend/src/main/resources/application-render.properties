# Render profile: embedded H2 (no external MySQL signup required)
# Data persists on Render disk until service is redeployed/reset.
spring.datasource.url=jdbc:h2:file:./data/teamtask;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
